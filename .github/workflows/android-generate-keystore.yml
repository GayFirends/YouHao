name: Generate Android Keystore

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'Signing key alias'
        required: true
        default: 'fuel-track-upload'

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      KEY_ALIAS: ${{ github.event.inputs.key_alias }}
    steps:
      - name: Generate keystore
        run: |
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/fuel-track-upload.jks" \
            -storetype PKCS12 \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Fuel Track, OU=Mobile, O=YouHao, L=Unknown, ST=Unknown, C=CN"
          base64 -w0 "$RUNNER_TEMP/fuel-track-upload.jks" > "$RUNNER_TEMP/fuel-track-upload.jks.base64"

      - name: Upload keystore artifact once
        uses: actions/upload-artifact@v4
        with:
          name: fuel-track-keystore-${{ github.run_id }}
          path: "$RUNNER_TEMP/fuel-track-upload.jks.base64"
          retention-days: 1
