name: Android Signed Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'App version name; must match package.json'
        required: true
        default: '0.2.0'
      version_code:
        description: 'Android version code'
        required: true
        default: '100'
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version_name) || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Resolve and validate release version
        shell: bash
        env:
          INPUT_VERSION_NAME: ${{ github.event.inputs.version_name }}
          INPUT_VERSION_CODE: ${{ github.event.inputs.version_code }}
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            release_version="${INPUT_VERSION_NAME}"
            version_code="${INPUT_VERSION_CODE}"
          else
            release_version="${GITHUB_REF_NAME#v}"
            IFS=. read -r major minor patch <<< "$package_version"
            version_code=$((major * 10000 + minor * 100 + patch))
          fi

          if [ "$release_version" != "$package_version" ]; then
            echo "::error::Release version $release_version does not match package.json version $package_version"
            exit 1
          fi
          if ! [[ "$version_code" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Android version code must be a positive integer"
            exit 1
          fi

          echo "ANDROID_VERSION_NAME=$release_version" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$version_code" >> "$GITHUB_ENV"

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "::error::Missing Repository Secret: ANDROID_KEYSTORE_BASE64"; exit 1; fi
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then echo "::error::Missing Repository Secret: ANDROID_KEYSTORE_PASSWORD"; exit 1; fi
          if [ -z "$ANDROID_KEY_ALIAS" ]; then echo "::error::Missing Repository Secret: ANDROID_KEY_ALIAS"; exit 1; fi
          if [ -z "$ANDROID_KEY_PASSWORD" ]; then echo "::error::Missing Repository Secret: ANDROID_KEY_PASSWORD"; exit 1; fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fuel-track-upload.jks"
          test -s "$RUNNER_TEMP/fuel-track-upload.jks"

      - name: Install, test and sync
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run check
          npm audit --audit-level=high
          npm run size:check
          npm run test:e2e
          npm run android:sync

      - name: Build signed APK and AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/fuel-track-upload.jks
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android --no-daemon assembleRelease bundleRelease

      - name: Verify signed artifacts
        run: |
          set -euo pipefail
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$apksigner_path"
          "$apksigner_path" verify --verbose android/app/build/outputs/apk/release/app-universal-release.apk
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab

      - name: Install and launch release APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/release/app-universal-release.apk
            adb shell am start -W -n com.youhao.fueltrack/.MainActivity
            adb shell pidof com.youhao.fueltrack

      - name: Rename release packages
        shell: bash
        run: |
          set -euo pipefail
          version="${ANDROID_VERSION_NAME#v}"
          output_dir="release-artifacts"
          mkdir -p "$output_dir"

          for apk in android/app/build/outputs/apk/release/*.apk; do
            file_name="$(basename "$apk")"
            case "$file_name" in
              app-*-release.apk)
                architecture="${file_name#app-}"
                architecture="${architecture%-release.apk}"
                ;;
              app-release.apk)
                architecture="universal"
                ;;
              *)
                echo "::error::Unknown APK output name: $file_name"
                exit 1
                ;;
            esac
            cp "$apk" "$output_dir/FuelTrack-${version}-${architecture}.apk"
          done

          cp android/app/build/outputs/bundle/release/app-release.aab \
            "$output_dir/FuelTrack-${version}-universal.aab"

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FuelTrack-${{ env.ANDROID_VERSION_NAME }}
          path: release-artifacts/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Fuel Track ${{ env.RELEASE_TAG }}
          body_path: CHANGELOG.md
          generate_release_notes: true
          files: release-artifacts/*
