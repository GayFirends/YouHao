name: Android Signed Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'App version name; must match app/build.gradle.kts'
        required: true
        default: '0.2.0'
      version_code:
        description: 'Android version code'
        required: true
        default: '200'
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version_name) || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve and validate release version
        shell: bash
        env:
          INPUT_VERSION_NAME: ${{ github.event.inputs.version_name }}
          INPUT_VERSION_CODE: ${{ github.event.inputs.version_code }}
        run: |
          set -euo pipefail
          # The build file is the single source of truth for the version; the release must not
          # drift from what the APK actually reports.
          app_version="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          echo "app/build.gradle.kts versionName: $app_version"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            release_version="${INPUT_VERSION_NAME}"
            version_code="${INPUT_VERSION_CODE}"
          else
            release_version="${GITHUB_REF_NAME#v}"
            IFS=. read -r major minor patch <<< "$app_version"
            version_code=$((major * 10000 + minor * 100 + patch))
          fi

          if [ "$release_version" != "$app_version" ]; then
            echo "::error::Release version $release_version does not match app/build.gradle.kts version $app_version"
            exit 1
          fi
          if ! [[ "$version_code" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Android version code must be a positive integer"
            exit 1
          fi

          echo "ANDROID_VERSION_NAME=$release_version" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$version_code" >> "$GITHUB_ENV"

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "::error::Missing Repository Secret: ANDROID_KEYSTORE_BASE64"; exit 1; fi
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then echo "::error::Missing Repository Secret: ANDROID_KEYSTORE_PASSWORD"; exit 1; fi
          if [ -z "$ANDROID_KEY_ALIAS" ]; then echo "::error::Missing Repository Secret: ANDROID_KEY_ALIAS"; exit 1; fi
          if [ -z "$ANDROID_KEY_PASSWORD" ]; then echo "::error::Missing Repository Secret: ANDROID_KEY_PASSWORD"; exit 1; fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fuel-track-upload.jks"
          test -s "$RUNNER_TEMP/fuel-track-upload.jks"

      - name: Verify tests before releasing
        run: ./gradlew --no-daemon :domain:test :app:testDebugUnitTest

      - name: Build signed APK and AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/fuel-track-upload.jks
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify signed artifacts
        run: |
          set -euo pipefail
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$apksigner_path"
          "$apksigner_path" verify --verbose app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Rename release packages
        shell: bash
        run: |
          set -euo pipefail
          version="${ANDROID_VERSION_NAME}"
          output_dir="release-artifacts"
          mkdir -p "$output_dir"

          cp app/build/outputs/apk/release/app-release.apk "$output_dir/FuelTrack-${version}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$output_dir/FuelTrack-${version}.aab"

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FuelTrack-${{ env.ANDROID_VERSION_NAME }}
          path: release-artifacts/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Fuel Track ${{ env.RELEASE_TAG }}
          body_path: CHANGELOG.md
          generate_release_notes: true
          files: release-artifacts/*
