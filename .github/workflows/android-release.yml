name: Android Signed Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'App version name, for example 1.0.0'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Android version code'
        required: true
        default: '1'
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_VERSION_NAME: ${{ github.event.inputs.version_name || github.ref_name }}
      ANDROID_VERSION_CODE: ${{ github.event.inputs.version_code || github.run_number }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version_name) || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "::error::Missing Repository Secret: ANDROID_KEYSTORE_BASE64"; exit 1; fi
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then echo "::error::Missing Repository Secret: ANDROID_KEYSTORE_PASSWORD"; exit 1; fi
          if [ -z "$ANDROID_KEY_ALIAS" ]; then echo "::error::Missing Repository Secret: ANDROID_KEY_ALIAS"; exit 1; fi
          if [ -z "$ANDROID_KEY_PASSWORD" ]; then echo "::error::Missing Repository Secret: ANDROID_KEY_PASSWORD"; exit 1; fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fuel-track-upload.jks"
          test -s "$RUNNER_TEMP/fuel-track-upload.jks"

      - name: Install, test and sync
        run: |
          npm ci
          npm test
          npm run android:sync

      - name: Build signed APK and AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/fuel-track-upload.jks
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android --no-daemon assembleRelease bundleRelease

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fuel-track-${{ env.ANDROID_VERSION_NAME }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Fuel Track ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/app-release.aab
